# Runs the Mac installer (research-workbench/scripts/mac) for real on GitHub's macOS runners:
# Node download + checksum, npm ci, build, LaunchAgent bootstrap, launcher app, --doctor, an update to
# the published commit with a data import, the Obsidian plugin copied into a fake vault (and nothing
# else in that vault changed), and --uninstall. If the runner does not allow
# `launchctl bootstrap gui/<uid>`, the installer health-checks the server directly instead and the job
# reports launchd as SKIPPED (a warning annotation and the step summary), never as verified.
name: Mac install

on:
  push:
    branches: [claude/vibrant-thompson-s3npyj]
    paths:
      - 'research-workbench/**'
      - '.github/workflows/mac-install.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: installer dry run (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint the starter and check the Node scripts parse
        run: |
          bash -n research-workbench/scripts/mac/install.sh
          shellcheck -s bash research-workbench/scripts/mac/install.sh
          for f in research-workbench/scripts/mac/install.mjs research-workbench/scripts/mac/lib/*.mjs; do node --check "$f"; done
      - name: install.sh --dry-run --no-launchd --source-dir (downloads and verifies Node, changes nothing)
        run: bash research-workbench/scripts/mac/install.sh --dry-run --no-launchd --source-dir "$GITHUB_WORKSPACE/research-workbench"
      - name: The dry run left no trace
        run: |
          test ! -e "$HOME/ResearchWorkbench"
          test ! -e "$HOME/.local/share/research-workbench"

  macos:
    name: install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      WB_APP: 研究工作台
      WB_LABEL: com.researchworkbench
    steps:
      - uses: actions/checkout@v4

      # Config files of the AI apps with someone else's content: the installer must merge into them,
      # keep everything else and leave a backup. Copies of the originals stay in $RUNNER_TEMP/ai-config.
      - name: Fake Claude Desktop and Codex (ChatGPT) config files
        run: |
          mkdir -p "$RUNNER_TEMP/ai-config" "$HOME/Library/Application Support/Claude" "$HOME/.codex"
          cat > "$RUNNER_TEMP/ai-config/claude_desktop_config.json" <<'EOF'
          {
            "globalShortcut": "Alt+Space",
            "mcpServers": {
              "filesystem": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-filesystem", "/Users/runner/Desktop"]
              }
            }
          }
          EOF
          cat > "$RUNNER_TEMP/ai-config/config.toml" <<'EOF'
          # Codex settings written by hand: every line here must survive the install
          model = "gpt-5" # the default model

          [mcp_servers.github]
          command = "npx"
          args = ["-y", "@modelcontextprotocol/server-github"]   # keep this comment

          [profiles.fast]
          model = "gpt-5-mini"
          EOF
          cp "$RUNNER_TEMP/ai-config/claude_desktop_config.json" "$HOME/Library/Application Support/Claude/"
          cp "$RUNNER_TEMP/ai-config/config.toml" "$HOME/.codex/"

      # A vault with the user's own notes and Obsidian settings: the installer may add only its plugin
      # folder and its id in community-plugins.json. vault-before.txt is the checksum of every other file.
      - name: Fake Obsidian vault and obsidian.json
        run: |
          vault="$RUNNER_TEMP/vault"
          mkdir -p "$vault/.obsidian/plugins/dataview" "$vault/日記" "$HOME/Library/Application Support/obsidian"
          printf '[]' > "$vault/.obsidian/community-plugins.json"
          printf '{"promptDelete":false}' > "$vault/.obsidian/app.json"
          printf '{"id":"dataview","version":"0.5.0"}' > "$vault/.obsidian/plugins/dataview/manifest.json"
          printf '# 今天\n我自己寫的筆記，安裝程式不能動它\n' > "$vault/日記/2026-10-30.md"
          printf '{"vaults":{"0123456789abcdef":{"path":"%s","ts":1761868800000,"open":true}}}' "$vault" > "$HOME/Library/Application Support/obsidian/obsidian.json"
          cd "$vault" && find . -type f ! -path './.obsidian/plugins/research-workbench-sync/*' ! -path './.obsidian/community-plugins.json' -exec shasum -a 256 {} + | sort > "$RUNNER_TEMP/vault-before.txt"
          cat "$RUNNER_TEMP/vault-before.txt"

      # macOS's own /bin/bash (3.2) in the same `-c "$(…)" -- <args>` form as the one-liner users paste;
      # the runner images put a newer Homebrew bash first on PATH
      - name: Install from this checkout
        id: install
        env:
          WB_SOURCE_DIR: ${{ github.workspace }}/research-workbench
        run: |
          /bin/bash --version | head -1
          /bin/bash -c "$(cat research-workbench/scripts/mac/install.sh)" -- --yes --obsidian-vault "$RUNNER_TEMP/vault"

      - name: The LaunchAgent serves /api/health
        env:
          LAUNCHD: ${{ steps.install.outputs.launchd }}
        run: |
          if [ "$LAUNCHD" = "ok" ]; then
            curl -fsS http://127.0.0.1:4310/api/health
            echo
            launchctl print "gui/$(id -u)/$WB_LABEL" | head -40
            echo "### launchd: verified on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=launchd SKIPPED::launchctl bootstrap was not possible on ${{ matrix.os }} (installer output: '$LAUNCHD'); the LaunchAgent is NOT verified, the server was health-checked directly"
            echo "### launchd: SKIPPED on ${{ matrix.os }} (not verified)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Files are in place (plist, links, folders, launcher)
        run: |
          plutil -lint "$HOME/Library/LaunchAgents/$WB_LABEL.plist"
          plutil -p "$HOME/Library/LaunchAgents/$WB_LABEL.plist"
          test -L "$HOME/ResearchWorkbench/current"
          test -L "$HOME/ResearchWorkbench/runtime/current"
          cat "$HOME/ResearchWorkbench/current/version.json"
          test -d "$HOME/Library/Application Support/ResearchWorkbench/backups"
          test -d "$HOME/Library/Logs/ResearchWorkbench"
          test -f "$HOME/Applications/$WB_APP.app/Contents/Resources/Scripts/main.scpt"
          osadecompile "$HOME/Applications/$WB_APP.app/Contents/Resources/Scripts/main.scpt"

      - name: Claude Desktop and Codex configs were merged, the existing content kept and backed up
        env:
          REGISTER: ${{ steps.install.outputs.register }}
        run: |
          echo "installer: $REGISTER"
          case "$REGISTER" in *claude-desktop:registered*chatgpt:registered*) ;; *) echo "expected claude-desktop and chatgpt to be registered"; exit 1 ;; esac
          claude="$HOME/Library/Application Support/Claude/claude_desktop_config.json"
          codex="$HOME/.codex/config.toml"
          cat "$claude" "$codex"
          # exactly one backup each, byte-for-byte the original
          test "$(ls "$claude".bak-* | wc -l)" -eq 1
          test "$(ls "$codex".bak-* | wc -l)" -eq 1
          cmp "$RUNNER_TEMP/ai-config/claude_desktop_config.json" "$claude".bak-*
          cmp "$RUNNER_TEMP/ai-config/config.toml" "$codex".bak-*
          cat > "$RUNNER_TEMP/check-ai-config.cjs" <<'EOF'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const home = process.env.HOME;
          const orig = (f) => fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'ai-config', f), 'utf8');
          const app = path.join(home, 'ResearchWorkbench', 'current');
          const node = path.join(home, 'ResearchWorkbench', 'runtime', 'current', 'bin', 'node');
          const adapter = path.join(app, 'dist', 'mcp', 'research-workbench-mcp.mjs');
          const dataDir = path.join(home, 'Library', 'Application Support', 'ResearchWorkbench');
          const toml = require(path.join(app, 'node_modules', 'smol-toml'));
          assert.ok(fs.existsSync(adapter), `the adapter was built: ${adapter}`);
          const tokens = JSON.parse(fs.readFileSync(path.join(dataDir, 'tokens.json'), 'utf8')).tokens;
          for (const c of ['claude-desktop', 'claude-code', 'chatgpt']) assert.ok(tokens[c], `tokens.json has ${c}`);
          const args = (client) => [adapter, `--client=${client}`, `--data-dir=${dataDir}`, '--port=4310'];

          const before = JSON.parse(orig('claude_desktop_config.json'));
          const after = JSON.parse(fs.readFileSync(path.join(home, 'Library', 'Application Support', 'Claude', 'claude_desktop_config.json'), 'utf8'));
          assert.equal(after.globalShortcut, before.globalShortcut);
          assert.deepEqual(after.mcpServers.filesystem, before.mcpServers.filesystem);
          assert.deepEqual(after.mcpServers['research-workbench'], { command: node, args: args('claude-desktop') });

          const tb = orig('config.toml');
          const ta = fs.readFileSync(path.join(home, '.codex', 'config.toml'), 'utf8');
          assert.ok(ta.startsWith(tb), 'every byte of the original config.toml, comments included, is still there');
          const pb = toml.parse(tb);
          const pa = toml.parse(ta);
          assert.equal(pa.model, pb.model);
          assert.deepEqual(pa.mcp_servers.github, pb.mcp_servers.github);
          assert.deepEqual(pa.profiles, pb.profiles);
          const rw = pa.mcp_servers.research_workbench;
          assert.equal(rw.command, node);
          assert.deepEqual(rw.args, args('chatgpt'));
          for (const t of ['commit_research_update', 'record_trade', 'close_trade']) assert.equal(rw.tools[t].approval_mode, 'prompt');
          console.log('Claude Desktop and Codex configs merged; the existing content is unchanged');
          EOF
          "$HOME/ResearchWorkbench/runtime/current/bin/node" "$RUNNER_TEMP/check-ai-config.cjs"

      - name: The Obsidian plugin is in the vault with this server's token, and nothing else in the vault changed
        env:
          OBSIDIAN: ${{ steps.install.outputs.obsidian }}
        run: |
          echo "installer: $OBSIDIAN"
          test "$OBSIDIAN" = "installed"
          vault="$RUNNER_TEMP/vault"
          plugin="$vault/.obsidian/plugins/research-workbench-sync"
          ls -la "$plugin"
          cmp "$HOME/ResearchWorkbench/current/dist/obsidian-plugin/main.js" "$plugin/main.js"
          cmp "$HOME/ResearchWorkbench/current/dist/obsidian-plugin/manifest.json" "$plugin/manifest.json"
          test "$(ls "$plugin" | tr '\n' ' ')" = "data.json main.js manifest.json "
          cat > "$RUNNER_TEMP/check-vault.cjs" <<'EOF'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const vault = path.join(process.env.RUNNER_TEMP, 'vault');
          const plugin = path.join(vault, '.obsidian', 'plugins', 'research-workbench-sync');
          const tokens = JSON.parse(fs.readFileSync(path.join(process.env.HOME, 'Library', 'Application Support', 'ResearchWorkbench', 'tokens.json'), 'utf8')).tokens;
          assert.ok(tokens.obsidian, 'tokens.json has obsidian');
          const data = JSON.parse(fs.readFileSync(path.join(plugin, 'data.json'), 'utf8'));
          assert.equal(data.token, tokens.obsidian);
          assert.equal(data.serverUrl, 'http://127.0.0.1:4310');
          if (process.argv[2] === 'update') {
            // the state the plugin keeps in data.json (seeded below after the first install) survives an update
            assert.equal(data.cursor, 42);
            assert.deepEqual(data.known, ['c:1', 't:2']);
            assert.equal(data.rootFolder, '我的研究');
          }
          assert.deepEqual(JSON.parse(fs.readFileSync(path.join(vault, '.obsidian', 'community-plugins.json'), 'utf8')), ['research-workbench-sync']);
          console.log('the plugin is installed with the obsidian token');
          EOF
          "$HOME/ResearchWorkbench/runtime/current/bin/node" "$RUNNER_TEMP/check-vault.cjs"
          cd "$vault" && find . -type f ! -path './.obsidian/plugins/research-workbench-sync/*' ! -path './.obsidian/community-plugins.json' -exec shasum -a 256 {} + | sort > "$RUNNER_TEMP/vault-after.txt"
          diff "$RUNNER_TEMP/vault-before.txt" "$RUNNER_TEMP/vault-after.txt"
          grep -q '"vault"' "$HOME/ResearchWorkbench/settings.json"
          # what the plugin itself would save there; the update below must keep it
          node="$HOME/ResearchWorkbench/runtime/current/bin/node"
          "$node" -e 'const f=process.argv[1];const fs=require("fs");const j=JSON.parse(fs.readFileSync(f,"utf8"));Object.assign(j,{rootFolder:"我的研究",cursor:42,known:["c:1","t:2"]});fs.writeFileSync(f,JSON.stringify(j,null,2))' "$plugin/data.json"

      - name: Doctor
        env:
          WB_SOURCE_DIR: ${{ github.workspace }}/research-workbench
          LAUNCHD: ${{ steps.install.outputs.launchd }}
        run: |
          if /bin/bash research-workbench/scripts/mac/install.sh --doctor; then exit 0; fi
          if [ "$LAUNCHD" = "ok" ]; then exit 1; fi
          echo "::warning title=doctor::doctor printed FAIL lines because launchd was skipped on this runner"

      - name: Installer unit tests on macOS (bsdtar, plutil)
        run: |
          cd "$HOME/ResearchWorkbench/current"
          PATH="$HOME/ResearchWorkbench/runtime/current/bin:$PATH" npx vitest run scripts/mac

      - name: Put a Codespaces-style data archive (the M0 command) in ~/Downloads
        run: |
          export PATH="$HOME/ResearchWorkbench/runtime/current/bin:$PATH"
          app="$HOME/ResearchWorkbench/current"
          src="$RUNNER_TEMP/codespace"
          mkdir -p "$src/data" "$HOME/Downloads"
          (cd "$app" && WORKBENCH_DATA_DIR="$src/data" node --import tsx src/server/seedDemo.ts)
          cd "$src"
          node -e "const D=require('$app/node_modules/better-sqlite3');const d=new D('data/workbench.db');d.backup('wb.db').then(()=>{d.close();console.log('ok')})"
          tar czf "$HOME/Downloads/wb-data.tgz" wb.db $(ls -d data/attachments 2>/dev/null)

      - name: Update to this commit as published on GitHub (codeload + raw), importing the archive
        id: update
        env:
          WB_RELEASE_COMMIT: ${{ github.sha }}
        run: /bin/bash research-workbench/scripts/mac/install.sh --yes

      - name: The update switched versions, kept the previous one and imported the data
        env:
          LAUNCHD: ${{ steps.update.outputs.launchd }}
          REGISTER: ${{ steps.update.outputs.register }}
        run: |
          short="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          test "$(readlink "$HOME/ResearchWorkbench/current")" = "app-$short"
          test -d "$HOME/ResearchWorkbench/app-$short-local"
          test ! -e "$HOME/Downloads/wb-data.tgz"
          ls "$HOME/Downloads"/wb-data.imported-*.tgz
          # the AI registration goes through the stable links: an update leaves the configs alone
          case "$REGISTER" in *claude-desktop:unchanged*chatgpt:unchanged*) ;; *) echo "expected no registration change: $REGISTER"; exit 1 ;; esac
          test "$(ls "$HOME/Library/Application Support/Claude/claude_desktop_config.json".bak-* | wc -l)" -eq 1
          test "$(ls "$HOME/.codex/config.toml".bak-* | wc -l)" -eq 1
          if [ "$LAUNCHD" = "ok" ]; then
            curl -fsS http://127.0.0.1:4310/api/projects | "$HOME/ResearchWorkbench/runtime/current/bin/node" -e \
              'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{const n=JSON.parse(s).length;console.log("companies after import:",n);if(n<1)process.exit(1)})'
          else
            echo "::warning title=launchd SKIPPED::not verified after the update either"
          fi

      - name: The update re-copied the plugin into the saved vault, kept its state and changed nothing else
        env:
          OBSIDIAN: ${{ steps.update.outputs.obsidian }}
        run: |
          echo "installer: $OBSIDIAN"
          case "$OBSIDIAN" in updated | unchanged) ;; *) echo "expected the saved vault to be updated"; exit 1 ;; esac
          cmp "$HOME/ResearchWorkbench/current/dist/obsidian-plugin/main.js" "$RUNNER_TEMP/vault/.obsidian/plugins/research-workbench-sync/main.js"
          "$HOME/ResearchWorkbench/runtime/current/bin/node" "$RUNNER_TEMP/check-vault.cjs" update
          cd "$RUNNER_TEMP/vault" && find . -type f ! -path './.obsidian/plugins/research-workbench-sync/*' ! -path './.obsidian/community-plugins.json' -exec shasum -a 256 {} + | sort > "$RUNNER_TEMP/vault-after.txt"
          diff "$RUNNER_TEMP/vault-before.txt" "$RUNNER_TEMP/vault-after.txt"

      - name: Doctor after the update
        env:
          LAUNCHD: ${{ steps.update.outputs.launchd }}
        run: |
          node="$HOME/ResearchWorkbench/runtime/current/bin/node"
          if "$node" "$HOME/ResearchWorkbench/current/scripts/mac/install.mjs" --doctor; then exit 0; fi
          if [ "$LAUNCHD" = "ok" ]; then exit 1; fi
          echo "::warning title=doctor::doctor printed FAIL lines because launchd was skipped on this runner"

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/wb-logs"
          cp -R "$HOME/Library/Logs/ResearchWorkbench/." "$RUNNER_TEMP/wb-logs/" 2>/dev/null || true
          cp "$HOME/Library/LaunchAgents/$WB_LABEL.plist" "$RUNNER_TEMP/wb-logs/" 2>/dev/null || true
          launchctl print "gui/$(id -u)/$WB_LABEL" > "$RUNNER_TEMP/wb-logs/launchctl-print.txt" 2>&1 || true
          ls -la "$HOME/ResearchWorkbench" > "$RUNNER_TEMP/wb-logs/ResearchWorkbench-ls.txt" 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: research-workbench-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/wb-logs
          if-no-files-found: warn

      - name: Uninstall (keeps data)
        if: always()
        env:
          WB_SOURCE_DIR: ${{ github.workspace }}/research-workbench
        run: |
          plugin="$RUNNER_TEMP/vault/.obsidian/plugins/research-workbench-sync"
          had_plugin=no
          if [ -f "$plugin/main.js" ]; then had_plugin=yes; fi
          /bin/bash research-workbench/scripts/mac/install.sh --uninstall --yes
          sleep 2
          test ! -e "$HOME/Library/LaunchAgents/$WB_LABEL.plist"
          test ! -e "$HOME/Applications/$WB_APP.app"
          test ! -e "$HOME/ResearchWorkbench"
          if launchctl print "gui/$(id -u)/$WB_LABEL" >/dev/null 2>&1; then echo "the job is still loaded"; exit 1; fi
          if curl -fs http://127.0.0.1:4310/api/health; then echo "still serving after uninstall"; exit 1; fi
          # the vault is the user's: uninstall leaves the plugin folder and every note in place
          if [ "$had_plugin" = "yes" ]; then
            test -f "$plugin/main.js"
            cd "$RUNNER_TEMP/vault" && find . -type f ! -path './.obsidian/plugins/research-workbench-sync/*' ! -path './.obsidian/community-plugins.json' -exec shasum -a 256 {} + | sort | diff "$RUNNER_TEMP/vault-before.txt" -
          fi
          if [ -d "$HOME/Library/Application Support/ResearchWorkbench" ]; then echo "data kept as intended"; fi
