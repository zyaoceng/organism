<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>有機體｜研究報告集</title>
<style>
:root{
  --bg:#EAE7E1; --card:#F7F5F1; --card2:#F1EEE8;
  --ink:#3E3A36; --sub:#7E786F; --line:#DCD6CC; --line2:#CBC3B6;
  --mu:#B4735A; --sn:#5B7FA3; --ph:#849A5C;
  --sand:#C0A170; --rose:#B08079; --slate:#8C8880;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"Noto Serif TC","Songti TC","PingFang TC",serif;
 font-size:15.5px;line-height:1.82;padding-bottom:70px}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.slide{background:var(--card);border:1px solid var(--line);border-radius:12px;
 padding:28px 30px;margin:22px 0;box-shadow:0 1px 2px rgba(62,58,54,.05)}
.kick{font-size:11px;letter-spacing:.22em;color:var(--sub);font-weight:700;text-transform:uppercase}
h1{font-size:33px;line-height:1.22;margin:10px 0 8px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--sub);font-size:13px;line-height:1.7}
p{margin:0 0 11px}
a{color:inherit;text-decoration:none}
.list{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.item{display:block;background:var(--card2);border:1px solid var(--line);border-radius:10px;
 padding:18px 20px;transition:border-color .15s}
.item:hover{border-color:var(--line2)}
.item .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:11px;
 border:1px solid var(--line2);color:var(--sub);margin-bottom:8px}
.item .tag.mu{border-color:var(--mu);color:var(--mu)}
.item .tag.sn{border-color:var(--sn);color:var(--sn)}
.item .tag.ph{border-color:var(--ph);color:var(--ph)}
.item .tag.sand{border-color:var(--sand);color:var(--sand)}
.item h3{font-size:17.5px;margin:0 0 5px;font-weight:700;color:var(--ink)}
.item p.desc{font-size:13.5px;color:var(--sub);margin:0 0 6px;line-height:1.7}
.item .meta{font-size:11.5px;color:var(--sub);font-family:ui-monospace,Menlo,monospace}
.empty{color:var(--sub);font-size:13.5px;padding:18px 20px}
.section-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.section-h h2{font-size:19px;margin:0;font-weight:800}
.section-h span{font-size:11.5px;color:var(--sub);letter-spacing:.05em}
.slide + .slide{margin-top:18px}
footer{color:var(--sub);font-size:11.5px;max-width:820px;margin:34px auto 0;
 padding:18px 20px;border-top:2px solid var(--ink);line-height:1.85}
@media(max-width:680px){
  h1{font-size:26px}
  .slide{padding:20px 17px}
}
</style>
</head>
<body>
<div class="wrap">

<div class="slide" style="border-top:5px solid var(--mu)">
  <div class="kick">有機體・研究報告集</div>
  <h1>有機體</h1>
  <p class="sub">個股與產業深度分析，持續更新</p>
</div>

<!-- ══════ 800VDC 分類 ══════ -->
<div class="slide">
  <div class="section-h"><h2>800VDC</h2><span>資料中心供電架構</span></div>
  <div class="list">

    <a class="item" href="./800vdc/">
      <span class="tag sand">800VDC</span>
      <h3>800VDC 產業概況</h3>
      <p class="desc">資料中心供電架構轉型｜供應鏈與受惠標的</p>
      <span class="meta">2026-08</span>
    </a>

    <!-- 之後新增 800VDC 相關報告，複製上面這個 <a class="item"> 區塊貼在這裡，改連結、標題、說明、日期即可 -->

  </div>
</div>

<!-- ══════ 記憶體 分類 ══════ -->
<div class="slide">
  <div class="section-h"><h2>記憶體</h2><span>MEMORY / STORAGE</span></div>
  <div class="list">

    <a class="item" href="./memory-2026-08/">
      <span class="tag mu">記憶體</span>
      <h3>記憶體：AI 時代的儲存生意</h3>
      <p class="desc">美光 MU・SanDisk SNDK・群聯 8299 ｜ 產業定義、缺貨走到哪、市佔格局、共識每股盈餘、目標價區間</p>
      <span class="meta">2026-08-16</span>
    </a>

    <!-- 之後新增記憶體相關報告，複製上面這個 <a class="item"> 區塊貼在這裡，改連結、標題、說明、日期即可 -->

  </div>
</div>

</div>

<footer>
  <div class="wrap" style="padding:0">研究與判斷：祖曜筬</div>
</footer>
</body>
</html>
